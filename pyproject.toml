[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpilot"
version = "0.1.0"
description = "ResearchPilot - Multi-Agent Deep Research & Knowledge Base Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ResearchPilot" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # FastAPI + Starlette are pinned as a tested pair: fastapi 0.112.x requires
    # starlette>=0.37.2,<0.39 and that combination is verified by `pip check` and
    # by the API integration tests in this repository.
    "fastapi>=0.110,<0.113",
    "starlette>=0.37.2,<0.39",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "PyYAML>=6.0",
    # Declared on purpose: the tokenizer is used by topical relevance scoring and
    # by the evaluation metrics. Leaving it optional made the measured baseline
    # environment-dependent (clean env without jieba: 30/35 tasks; with jieba:
    # 35/35 on identical code - verified A/B), so it is a hard dependency now.
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
embeddings = ["sentence-transformers>=2.6"]

[project.scripts]
researchpilot = "researchpilot.cli:main"
researchpilot-mcp = "researchpilot.mcp.server:main"

[tool.setuptools.packages.find]
include = ["researchpilot*"]

[tool.setuptools.package-data]
researchpilot = ["api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "evaluation: end-to-end evaluation harness tests (slower)",
    "integration: multi-component integration tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "runs", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF001-003 flag "ambiguous" full-width punctuation, which is normal in this
# Chinese-language project (prompts, docs and fixtures are written in Chinese).
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["runs/", "build/"]
# `mypy .` walks tests/ and scripts/ too; without explicit package bases the same
# file can be imported both as `tests.fixtures.openai_stub` and `openai_stub`,
# which mypy refuses to type-check ("found twice under different module names").
explicit_package_bases = true
namespace_packages = true
mypy_path = "."

# Test helpers and pytest fixtures take untyped framework objects (monkeypatch,
# tmp_path, capsys, ...); demanding a full signature there produces noise without
# catching real defects. Bodies are still type-checked, and `researchpilot/` keeps
# the strict `disallow_untyped_defs` setting.
[[tool.mypy.overrides]]
module = ["tests.*", "tests", "scripts.*", "scripts"]
disallow_untyped_defs = false
check_untyped_defs = true
disallow_incomplete_defs = false
