[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpilot"
version = "0.1.0"
description = "ResearchPilot - Multi-Agent Deep Research & Knowledge Base Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ResearchPilot" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
embeddings = ["sentence-transformers>=2.6"]

[project.scripts]
researchpilot = "researchpilot.cli:main"
researchpilot-mcp = "researchpilot.mcp.server:main"

[tool.setuptools.packages.find]
include = ["researchpilot*"]

[tool.setuptools.package-data]
researchpilot = ["api/static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "evaluation: end-to-end evaluation harness tests (slower)",
    "integration: multi-component integration tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "runs", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# RUF001-003 flag "ambiguous" full-width punctuation, which is normal in this
# Chinese-language project (prompts, docs and fixtures are written in Chinese).
ignore = ["B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["runs/", "build/"]
