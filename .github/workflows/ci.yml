name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy researchpilot

  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/unit tests/integration -q --cov=researchpilot --cov-report=term-missing --cov-report=xml
      - name: frontend logic tests (node, no npm dependencies)
        run: node --test "tests/frontend/**/*.test.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  evaluation:
    name: evaluation smoke test (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: golden dataset integrity
        run: python -m pytest tests/evaluation -q -m "not evaluation"
      - name: run benchmark (mock provider, deterministic)
        run: python scripts/run_benchmark.py --provider mock --no-docs
      - name: evaluation smoke test
        run: python -m pytest tests/evaluation/test_smoke.py -q -m evaluation
      - name: compose topology smoke test (engine-free)
        run: python scripts/compose_smoke.py --timeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: benchmarks/

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: researchpilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
