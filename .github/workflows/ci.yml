name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    name: type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: mypy researchpilot

  test:
    name: unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: python -m pytest tests/unit tests/integration -q --cov=researchpilot --cov-report=term-missing --cov-report=xml
      - name: frontend logic tests (node, no npm dependencies)
        run: node --test "tests/frontend/**/*.test.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  evaluation:
    name: evaluation smoke test (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - name: golden dataset integrity
        run: python -m pytest tests/evaluation -q -m "not evaluation"
      - name: run benchmark (mock provider, deterministic)
        run: python scripts/run_benchmark.py --provider mock --no-docs
      - name: evaluation smoke test
        run: python -m pytest tests/evaluation/test_smoke.py -q -m evaluation
      - name: compose topology smoke test (engine-free)
        run: python scripts/compose_smoke.py --timeout 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: benchmarks/

  package:
    name: build + installed wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c constraints.txt "build>=1.2,<2"
      - run: python -m build
      - name: install wheel into a second clean environment
        run: |
          python -m venv /tmp/researchpilot-wheel
          /tmp/researchpilot-wheel/bin/python -m pip install \
            -c "$GITHUB_WORKSPACE/constraints.txt" "$GITHUB_WORKSPACE"/dist/*.whl
      - name: smoke test the installed package outside the checkout
        run: cd /tmp && /tmp/researchpilot-wheel/bin/python "$GITHUB_WORKSPACE/scripts/installed_package_smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/

  docker:
    name: docker build + compose smoke (real engine)
    runs-on: ubuntu-latest
    # GitHub Actions is the acceptance environment for the container story: this
    # machine has no working Docker Engine, so the real `docker build` /
    # `docker compose up` / in-container smoke test only ever runs here. The job is
    # deliberately unconditional - no `if:`, no `continue-on-error`, no mock
    # engine - so a broken container fails the whole workflow.
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4

      - name: engine info (fails loudly if the runner has no engine)
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: build the image from the project Dockerfile
        run: |
          set -euo pipefail
          docker build --file Dockerfile --tag researchpilot:latest .
          docker image inspect researchpilot:latest --format 'built {{.Id}} cmd={{.Config.Cmd}}'

      - name: validate the project docker-compose.yml
        run: docker compose --file docker-compose.yml config --quiet

      - name: start the stack (compose up --wait runs every healthcheck)
        run: |
          set -euo pipefail
          docker compose --file docker-compose.yml up --detach --wait --wait-timeout 300
          docker compose --file docker-compose.yml ps

      - name: container health checks (docker inspect)
        run: |
          set -euo pipefail
          for service in mcp api; do
            container="$(docker compose --file docker-compose.yml ps --quiet "$service")"
            test -n "$container" || { echo "::error::compose started no container for $service"; exit 1; }
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")"
            echo "$service -> status=$status"
            if ! docker inspect --format '{{json .State.Health}}' "$container"; then
              echo "::warning::no health block reported for $service"
            fi
            test "$status" = "healthy" || { echo "::error::$service is not healthy ($status)"; exit 1; }
          done

      - name: smoke test the stack on the published ports
        run: |
          set -euo pipefail
          python3 scripts/container_smoke.py \
            --api-url http://127.0.0.1:8000 \
            --mcp-url http://127.0.0.1:8765 \
            --json-out docker-smoke.json

      - name: smoke test inside the API container
        run: |
          set -euo pipefail
          docker compose exec -T api \
            python scripts/container_smoke.py --in-container --json-out /tmp/docker-smoke.json

      - name: container logs (on failure)
        if: failure()
        run: docker compose --file docker-compose.yml logs --no-color --timestamps

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-smoke
          path: docker-smoke.json
          if-no-files-found: warn

      - name: tear down the stack
        if: always()
        run: docker compose --file docker-compose.yml down --volumes --remove-orphans
